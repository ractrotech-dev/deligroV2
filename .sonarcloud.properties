# SonarCloud automatic analysis settings.
#
# scripts/qa and the mobile *.test.mjs files are test code, not product code.
# Declaring them as tests applies Sonar's test rules to them instead of the
# production ones — e.g. the service-worker harness has to evaluate
# public/sw-core.js in a vm sandbox to reach its functions, which is the point
# of a test, not an injection risk.
#
# Not analysed at all (docs/SONAR_MAINTAINABILITY_AUDIT.md, "Scope decisions"):
# - supabase/seed/** is generated by scripts/generate-legacy-seed-sql.ts; the
#   generator is analysed, its INSERT output is data.
# - root and docs/ *.html are audit reports, not shipped. public/offline.html
#   ships, so it stays in.
sonar.sources=.
sonar.exclusions=scripts/qa/**,mobile/scripts/*.test.mjs,backups/**,supabase/seed/**,*.html,docs/**/*.html,apps/*/third_party/onesignal_flutter/**,apps/*/android/build.gradle.kts,apps/customer/third_party/deligro_push_style/android/build.gradle
# - apps/*/third_party/onesignal_flutter is OneSignal's own plugin, vendored with
#   one build-file fix (README.deligro.md); its findings are not ours to edit.
# - The Android root build files and the deligro_push_style plugin build file
#   resolve their libraries through Flutter's Gradle plugin and pubspec.lock;
#   Sonar's "no gradle lockfile" finding (S8569) asks for a second lock system
#   that Flutter's build does not use.
sonar.tests=scripts/qa,mobile/scripts
sonar.test.inclusions=scripts/qa/**,mobile/scripts/*.test.mjs

# Left out of duplication detection only (still analysed for bugs/security):
# migrations are an append-only history that each redefine earlier functions
# and can't be edited once applied.
sonar.cpd.exclusions=supabase/migrations/**
