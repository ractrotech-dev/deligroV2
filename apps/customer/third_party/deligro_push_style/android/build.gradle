group 'com.ractrotech.deligro.pushstyle'
version '1.0.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace 'com.ractrotech.deligro.pushstyle'

    defaultConfig {
        minSdkVersion 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Same JVM target as the apps (17); without it Kotlin follows the JDK (21) and
// Gradle refuses the mismatch.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Same native version as the vendored onesignal_flutter. compileOnly: the
    // app already ships it through that plugin.
    compileOnly "com.onesignal:notifications:5.10.2"
    compileOnly "com.onesignal:core:5.10.2"
    implementation "androidx.core:core-ktx:1.13.1"
}
