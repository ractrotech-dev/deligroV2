name: deligro_manager
description: "Deligro Manager — the operations app for city managers"
publish_to: 'none'

# versionCode must exceed the Capacitor Manager app's (mobile/roles.json: manager 1).
# Keep in step with lib/config/env.dart versionCode.
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  onesignal_flutter: ^5.7.1
  fl_chart: ^1.2.0
  excel: ^4.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
    - assets/brand/splash-logo.jpg
    - assets/brand/splash-art.jpg
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

# onesignal_flutter 5.7.1 with an AGP 9-compatible Android build file — the
# customer app's vendored copy (apps/customer/third_party/onesignal_flutter).
dependency_overrides:
  onesignal_flutter:
    path: ../customer/third_party/onesignal_flutter
