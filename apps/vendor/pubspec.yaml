name: deligro_partner
description: "Deligro Partner — the vendor app"
publish_to: 'none'

# versionCode must exceed the Capacitor Partner app's (mobile/roles.json: vendor 2).
version: 2.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.3
  cached_network_image: ^4.0.4
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  onesignal_flutter: ^5.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/mark.png
    - assets/brand/splash-logo.jpg
    - assets/brand/splash-art.jpg

# Same artwork as the customer app (apps/customer/tool/brand.mjs). Regenerate:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: assets/brand/icon_background.png
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  remove_alpha_ios: true
  background_color_ios: "#E59A01"

flutter_native_splash:
  color: "#E59A01"
  android_12:
    color: "#E59A01"
    image: assets/brand/splash_blank.png

# onesignal_flutter 5.7.1 with an AGP 9-compatible Android build file, shared
# with the customer app — see ../customer/third_party/onesignal_flutter/README.deligro.md.
dependency_overrides:
  onesignal_flutter:
    path: ../customer/third_party/onesignal_flutter
