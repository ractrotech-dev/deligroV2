<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel Version 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Deligro's real console palette. Layout idea: nine plain sidebar items, each
   section's pages as tabs on top, and the one number that matters first. */
:root {
  color-scheme: dark;
  --bg: #141416; --surface: #1e2024; --surface-2: #1a1c20; --ink: #e8eaf0; --muted: #9aa0ae;
  --line: #2a2d35; --divider: #23262e; --hover: #262a31;
  --accent: #ff6035; --accent-soft: #2a1208; --accent-ink: #ff8a62; --on-accent: #1a0a04;
  --green: #26c97a; --green-soft: #0c2a1b; --red: #ff6f55; --red-soft: #2e120c;
  --amber: #f5b84a; --amber-soft: #241800; --blue: #5b9aff; --blue-soft: #0a1830;
  --r: 8px; --font: Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font); font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

.strip { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 16px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; font-weight: 600; }
.strip a { text-decoration: underline; white-space: nowrap; }
.app { display: flex; min-height: calc(100% - 32px); }

.side { width: 216px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; position: sticky; top: 0; height: calc(100vh - 32px); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; font-size: 16px; font-weight: 800; }
.brand i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-style: normal; }
.nav { display: grid; gap: 3px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: var(--r); color: var(--muted); font-size: 14.5px; font-weight: 600; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent-ink); }
.nav svg, .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav b { margin-left: auto; min-width: 21px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; text-align: center; }
.foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 8px 0; display: grid; gap: 8px; font-size: 12.5px; color: var(--muted); }
.foot strong { color: var(--ink); font-size: 13px; }

.main { flex: 1; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 28px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 3; }
.search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; color: var(--ink); font: inherit; }
.page { padding: 22px 28px 60px; max-width: 1320px; display: grid; gap: 22px; }
.crumb { display: flex; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 500; }
.crumb a:hover { color: var(--ink); }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 15px; font-weight: 700; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-top: -10px; }
.tabs a { padding: 9px 13px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-color: var(--accent); }
.tabs em { font-style: normal; color: var(--accent-ink); margin-left: 4px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.go:hover { background: #ff7650; }
.btn.bad { color: var(--red); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.grid { display: grid; gap: 12px; }
.g5 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 22px; align-items: start; }
.half { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; align-items: start; }
.tile { display: block; padding: 15px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
a.tile:hover { border-color: #454a56; background: var(--hover); }
.tile .n { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.tile .l { display: block; margin-top: 5px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
.tile.hot { border-color: #6b2a1a; background: var(--red-soft); }
.tile.hot .n { color: var(--red); }
.tile.warn .n { color: var(--amber); }
.tile.ok .n { color: var(--green); }
.tile.link { display: flex; gap: 12px; align-items: center; font-weight: 700; }
.tile.link span { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.tile.link .ic { color: var(--accent-ink); width: 22px; height: 22px; }

.big small { display: block; color: var(--muted); font-size: 14px; font-weight: 600; }
.big strong { display: block; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.big p { color: var(--muted); font-size: 13px; }
.alarm { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-radius: var(--r); background: #4a140b; border: 1px solid var(--red); font-weight: 700; }
.note { padding: 10px 13px; border-radius: var(--r); background: var(--amber-soft); color: var(--amber); font-weight: 600; font-size: 13px; }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th { padding: 9px 14px; text-align: left; color: var(--muted); font-size: 12.5px; font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--divider); }
tr:last-child td { border-bottom: 0; }
tr[data-go] { cursor: pointer; }
tr[data-go]:hover td { background: var(--hover); }
.r { text-align: right; }
.b { font-weight: 700; }
.m { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pg { color: var(--green); } .pr { color: var(--red); } .pa { color: var(--amber); } .pb { color: var(--blue); } .pm { color: var(--muted); }

.facts { display: grid; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--divider); }
.facts dt, .facts span:first-child { color: var(--muted); }
.facts .sum { font-weight: 800; font-size: 15px; border: 0; border-top: 1px solid var(--line); }
.facts .sum span:first-child { color: var(--ink); }
.steps { display: flex; gap: 4px; }
.steps div { flex: 1; padding-top: 7px; border-top: 4px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; }
.steps .done { border-color: var(--green); color: var(--ink); }
.steps .now { border-color: var(--accent); color: var(--accent-ink); }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; height: 100%; font-size: 12px; color: var(--muted); }
.bars i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: #4a4f5c; }
.bars .today i { background: var(--accent); }
.bars .today { color: var(--ink); font-weight: 700; }
label.f { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
label.f input, label.f select { padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 400; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; max-width: 860px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--divider); font-weight: 600; max-width: 620px; }
.sw button { width: 44px; height: 24px; padding: 2px; border: 0; border-radius: 99px; background: #3a3e48; display: flex; }
.sw button::before { content: ""; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.sw button[aria-pressed="true"] { background: var(--green); justify-content: flex-end; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: #141416; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 9; }
.toast.show { opacity: 1; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.photos div { aspect-ratio: 1; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); text-align: center; font-weight: 600; font-size: 13px; padding: 8px; }
@media (max-width: 820px) {
  .app { display: block; }
  .side { position: static; width: 100%; height: auto; border-right: 0; }
  .nav { grid-auto-flow: column; overflow-x: auto; }
  .nav a { white-space: nowrap; }
  .foot { display: none; }
  .split { grid-template-columns: 1fr; }
  .page, .top { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="strip"><span>Admin Panel Version 2. Design preview with sample numbers. Click anything.</span><span class="row"><a href="#problems-found">Problems found today</a><a href="#all-pages">Where every old page went</a></span></div>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home"><i>D</i>Deligro</a>
    <nav class="nav" id="nav" aria-label="Admin"></nav>
    <div class="foot"><strong>Admin</strong><a href="#home">Open customer app</a><a href="#home">Sign out</a></div>
  </aside>
  <div class="main">
    <div class="top"><label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Find a shop, order, customer or rider" aria-label="Search"></label></div>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const I = {
  home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  shops:'<path d="M4 9 5.500 4h13L20 9"/><path d="M4 9a3 3 0 0 0 5.300 1.800 3 3 0 0 0 5.400 0A3 3 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>',
  people:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.300"/>',
  bike:'<circle cx="6" cy="17" r="3.500"/><circle cx="18" cy="17" r="3.500"/><path d="M6 17 10 9h5l3 8M9 6h3"/>',
  money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.500"/>',
  gift:'<rect x="3" y="9" width="18" height="4"/><path d="M5 13v8h14v-8M12 9v12M12 9S10 3 7.500 4.500 9 9 12 9zm0 0s2-6 4.500-4.500S15 9 12 9z"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M18.400 5.600l-2.100 2.100M7.700 16.300l-2.100 2.100"/>',
  map:'<path d="M12 21s7-6.300 7-11a7 7 0 0 0-14 0c0 4.700 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',
  sw:'<rect x="3" y="8" width="18" height="9" rx="4.500"/><circle cx="16.500" cy="12.500" r="2"/>',
  rupee:'<path d="M7 5h10M7 9h10M7 5c6 0 6 8 0 8l7 7"/>',
  text:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const SECTIONS = [
  {id:'home', label:'Home', icon:'home', to:'home', pages:[]},
  {id:'orders', label:'Orders', icon:'orders', badge:5, to:'orders-live', pages:[['orders-live','Live'],['orders-problems','Problems',2],['orders-all','All orders'],['orders-refunds','Refunds',3]]},
  {id:'shops', label:'Shops', icon:'shops', badge:2, to:'shops-all', pages:[['shops-all','All shops'],['shops-new','New shops',2],['shops-order','Home page order'],['shops-cats','Categories'],['shops-photos','Photos']]},
  {id:'customers', label:'Customers', icon:'people', to:'customers', pages:[]},
  {id:'riders', label:'Riders', icon:'bike', to:'riders-all', pages:[['riders-all','All riders'],['riders-rewards','Rewards']]},
  {id:'money', label:'Money', icon:'money', to:'money-pay', pages:[['money-pay','Pay shops'],['money-riders','Pay riders'],['money-cash','Cash'],['money-reports','Reports']]},
  {id:'offers', label:'Offers', icon:'gift', to:'offers-codes', pages:[['offers-codes','Promo codes'],['offers-banners','Banners'],['offers-requests','Shop requests',1]]},
  {id:'messages', label:'Messages', icon:'chat', badge:1, to:'messages-help', pages:[['messages-help','Help requests',1],['messages-alerts','Alerts',2],['messages-news','Announcements']]},
  {id:'set', label:'Settings', icon:'gear', to:'set-home', pages:[]},
];

const pill = (t, c) => `<span class="pill ${c}">${t}</span>`;
function table(cols, rows, goFn) {
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.r?'r':''}">${c.t}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => { const go = goFn && goFn(r);
      return `<tr ${go?`data-go="${go}"`:''}>${cols.map((c,i) => {
        let v = c.f ? c.f(r) : r[c.k];
        if (go && i===0) v = `<a href="#${go}">${v}</a>`;
        return `<td class="${c.r?'r ':''}${c.b?'b':''}">${v}</td>`; }).join('')}</tr>`; }).join('')
  }</tbody></table></div>`;
}
const pager = (t) => `<div class="row" style="justify-content:space-between"><span class="m">${t}</span><span class="row"><button class="btn sm" data-toast="Previous page">Back</button><button class="btn sm" data-toast="Next page">Next</button></span></div>`;
const act = (t, msg, cls='') => `<button class="btn ${cls}" data-toast="${msg||t+': sample only'}">${t}</button>`;
const facts = rows => `<div class="facts">${rows.map(([a,b,s]) => `<div class="${s?'sum':''}"><span>${a}</span><span>${b}</span></div>`).join('')}</div>`;
const LIVE = [
  {o:'2257B730',s:'Sharma Sweets',c:'Asha Verma',r:'Ravi',st:'On the way',cl:'pb',t:'12 min'},
  {o:'8E9B1583',s:'Pizza Corner',c:'Rohit Sahu',r:'Amit',st:'Cooking',cl:'pa',t:'18 min'},
  {o:'FA074CB6',s:'Biryani House',c:'Neha Jain',r:'None',st:'Ready',cl:'pr',t:'26 min'},
  {o:'7C10DE22',s:'Cafe Mocha',c:'Vikas Rao',r:'Sunil',st:'On the way',cl:'pb',t:'9 min'},
  {o:'3AB91F07',s:'Tandoor Point',c:'Pooja Das',r:'None',st:'New',cl:'pa',t:'2 min'},
];
const ORDERCOL = [{t:'Order',k:'o',b:1},{t:'Shop',k:'s'},{t:'Customer',k:'c'},{t:'Rider',k:'r'},{t:'Status',f:r=>pill(r.st,r.cl)},{t:'Time',k:'t',r:1}];
const SHOPS = [
  {n:'Sharma Sweets',a:'Bemetara',o:42,st:'Open',cl:'pg',pay:'₹1,534'},
  {n:'Pizza Corner',a:'Bemetara',o:128,st:'Open',cl:'pg',pay:'₹12,480'},
  {n:'Biryani House',a:'Durg',o:66,st:'Closed',cl:'pm',pay:'₹3,360'},
  {n:'Cafe Mocha',a:'Bemetara',o:31,st:'Open',cl:'pg',pay:'₹0'},
];

const V = {
home: () => `
  <div class="alarm"><span>Ravi pressed SOS</span><a class="btn sm" href="#messages-help">Open</a></div>
  <section class="grid"><h2>Needs you</h2><div class="grid g5">
    <a class="tile hot" href="#orders-problems"><span class="n">2</span><span class="l">Orders in trouble</span></a>
    <a class="tile hot" href="#orders-refunds"><span class="n">3</span><span class="l">Refunds to check</span></a>
    <a class="tile warn" href="#shops-new"><span class="n">2</span><span class="l">New shops to approve</span></a>
    <a class="tile warn" href="#money-pay"><span class="n">₹17,374</span><span class="l">To pay 3 shops</span></a>
    <a class="tile warn" href="#messages-help"><span class="n">1</span><span class="l">Help request</span></a>
  </div></section>
  <section class="grid"><h2>Today</h2><div class="grid g4">
    <a class="tile" href="#orders-all"><span class="n">48</span><span class="l">Orders</span></a>
    <a class="tile" href="#money-reports"><span class="n">₹32,400</span><span class="l">Sales</span></a>
    <a class="tile" href="#money-reports"><span class="n">₹2,910</span><span class="l">We earned</span></a>
    <a class="tile" href="#riders-all"><span class="n">6 of 14</span><span class="l">Riders on delivery</span></a>
  </div></section>
  <div class="split">
    <section class="grid"><div class="head"><h2>Live orders</h2><a class="btn sm" href="#orders-live">See all</a></div>${table(ORDERCOL.filter(c=>c.t!=='Customer'), LIVE, r=>'order-view')}</section>
    <section class="grid"><h2>Orders, last 7 days</h2><div class="tile"><div class="bars">${[['Thu',31],['Fri',44],['Sat',62],['Sun',71],['Mon',38],['Tue',41],['Today',48]].map(([d,n],i)=>`<div class="${i===6?'today':''}"><span>${n}</span><i style="height:${n*1.5}px"></i><span>${d}</span></div>`).join('')}</div></div></section>
  </div>`,

'orders-live': () => table(ORDERCOL, LIVE, r=>'order-view'),
'orders-problems': () => table([{t:'Order',k:'o',b:1},{t:'Shop',k:'s'},{t:'Problem',f:r=>pill(r.p,'pr')},{t:'',r:1,f:r=>act(r.a)}],
  [{o:'FA074CB6',s:'Biryani House',p:'No rider',a:'Give a rider'},{o:'2257B730',s:'Sharma Sweets',p:'12 min late',a:'Call rider'},{o:'51EE0A19',s:'Pizza Corner',p:'Payment failed',a:'Call customer'}], r=>'order-view'),
'orders-all': () => `<div class="row">${['Today','Yesterday','This week','All'].map((t,i)=>`<button class="btn sm" data-toast="Shows ${t.toLowerCase()}">${t}</button>`).join('')}</div>` +
  table(ORDERCOL, [...LIVE,{o:'C47D0011',s:'Pizza Corner',c:'Anil Kumar',r:'Amit',st:'Delivered',cl:'pg',t:'31 min'},{o:'D19E0042',s:'Cafe Mocha',c:'Riya Sen',r:'None',st:'Cancelled',cl:'pm',t:''}], r=>'order-view') + pager('1 to 7 of 12,480 orders'),
'orders-refunds': () => table([{t:'Order',k:'o',b:1},{t:'Customer',k:'c'},{t:'Why',k:'w'},{t:'Amount',k:'a',r:1,b:1},{t:'',r:1,f:()=>`<span class="row" style="justify-content:flex-end">${act('Give money back','Refund approved: sample only','go')}${act('Say no')}</span>`}],
  [{o:'B2201C44',c:'Asha Verma',w:'Food was cold',a:'₹240'},{o:'9F11AA20',c:'Rohit Sahu',w:'Item missing',a:'₹120'},{o:'71CC0D31',c:'Neha Jain',w:'Never arrived',a:'₹510'}]),
'order-view': () => `
  <div class="crumb"><a href="#orders-live">Orders</a><span>/</span><span>2257B730</span></div>
  <div class="head"><h1>Order 2257B730</h1><div class="row">${act('Call rider')}${act('Give money back')}${act('Cancel order','Cancel: sample only','bad')}</div></div>
  <div class="steps">${[['New','done'],['Cooking','done'],['Ready','done'],['On the way','now'],['Delivered','']].map(([t,c])=>`<div class="${c}">${t}</div>`).join('')}</div>

  </div>
  <p class="note">Found by reading the code. Nothing was run on the live system, and which database updates are live is not known.</p>` +
  group('Money and accounts: fix first', [
    ['Pay riders','Admin payment stops working once database update 0152 is live, and admin has no screen for rider pay requests.'],
    ['Refunds','Only the newest 50 show, so older open refunds can vanish and totals come out low.'],
    ['Delete a shop','Also deletes the owner\'s login, even if that person is a customer too.'],
    ['Partner printed statement','Still says the shop holds the cash. That is the old wrong rule.'],
    ['Home','Shop payments can show 0 while shops are owed money.'],
    ['Settlements','Can say every shop is paid while payments are unfinished.'],
    ['Paid orders','Undo always fails for orders paid with the normal Pay button.'],
  ]) +
  group('Things you cannot do today', [
    ['Shops','Admin cannot set a map pin, and a shop with no pin cannot go live.'],
    ['Riders and managers','Admin cannot stop them or reset their passwords.'],
    ['Refunds','Admin cannot start a refund from an order, or mark a cash refund as handed back.'],
    ['Areas','Shops cannot be put in an area, so a manager in a second area probably sees no shops.'],
    ['Customers, Orders, History','Older records cannot be reached: lists stop at 200, 50 and 100.'],
    ['One-person payments','With only one admin, payments wait for a second person until a setting is switched on.'],
  ]) +
  group('Admin buttons that do nothing or mislead', [
    ['Banners','5 of 6 placements never show. Cities, zones and customer groups are ignored. The Orders count stays at zero.'],
    ['Marketing requests','4 of 8 buttons always refuse, and approving makes no campaign.'],
    ['App switches','One switch does nothing. Navigation only works on the website. Open and close leaves admin with no control.'],
    ['Alert rules','Fraud and service rules show On, but nothing checks them.'],
    ['Category pictures','Reset says Saved but changes nothing.'],
    ['Announcements','The form keeps its text, so a second click sends it again.'],
  ]) +
  group('Flutter apps', [
    ['Manager','Insights is an empty page, and its unfinished work sits on other branches.'],
    ['Manager','Offer and campaign edits are almost always refused. On and off alert rules cannot be saved.'],
    ['Manager','Normal words in order search give an error. The report status filter is always empty.'],
    ['Rider','Stopped or rejected riders are told they are not riders, and cannot fix their documents.'],
    ['Rider','Reject fails on open offers. Picking up too early looks like a lost job.'],
    ['Partner','Some alerts open a page that does not exist, like shop approved or dish hidden.'],
    ['Partner','Turned-off features stay visible until restart. A dish Deligro hid still looks live.'],
    ['Customer','Order again drops dishes added in the Partner app. Customers get no announcements.'],
    ['All apps','Version numbers have not gone up since 27 Oct, so recent fixes cannot be offered to phones.'],
  ]);
},

  ['Support','Messages › Help requests','messages-help'],['Alerts','Messages › Alerts','messages-alerts'],['Alert settings','Messages › Alerts › Alert rules','set-alerts'],['Announcements','Messages › Announcements','messages-news'],
  ['Marketing requests','Offers › Shop requests','offers-requests'],['Campaigns','Offers › Banners','offers-banners'],['Promo codes','Offers › Promo codes','offers-codes'],
  ['Vendors','Shops › All shops, New shops','shops-all'],['Add vendor','Shops › Add a shop','shop-add'],['Featured slots','Shops › Home page order','shops-order'],['Storage, Food images','Shops › Photos','shops-photos'],['Categories (two old pages)','Shops › Categories','shops-cats'],
  ['Customers','Customers','customers'],['Riders','Riders › All riders','riders-all'],['Rider incentives','Riders › Rewards','riders-rewards'],['Rider money tab','Money › Pay riders','money-riders'],
  ['Settings','Settings','set-home'],['Team','Settings › Team','set-team'],['Zones','Settings › Areas','set-areas'],['Platform config','Settings › Prices and rules','set-prices'],['Feature access','Settings › App switches','set-switches'],['Vendor SMS','Settings › Shop text messages','set-texts'],['Audit log','Settings › History','set-history'],
].map(([a,b,g])=>({a,b,g}))),
};

const TITLES = {home:'Home',customers:'Customers','set-home':'Settings','set-team':'Team','set-areas':'Areas','set-prices':'Prices and rules','set-switches':'App switches','set-texts':'Shop text messages','set-history':'History'};
const HEADLESS = /-view$|^shop-add$|^pay-|^set-alerts$|^all-pages$|^problems-found$/;
const SECTION_OF = {'order-view':'orders','shop-view':'shops','shop-add':'shops','customer-view':'customers','rider-view':'riders','pay-shop':'money','pay-confirm':'money','help-view':'messages','set-alerts':'messages'};

function sectionFor(route) {
  if (SECTION_OF[route]) return SECTION_OF[route];
  return (SECTIONS.find(s => route === s.to || s.pages.some(p => p[0] === route) || route.startsWith(s.id + '-')) || {}).id;
}
function render() {
  const route = V[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  const secId = sectionFor(route);
  const sec = SECTIONS.find(s => s.id === secId);
  document.getElementById('nav').innerHTML = SECTIONS.map(s =>
    `<a href="#${s.to}" class="${s.id===secId?'on':''}" ${s.id===secId?'aria-current="page"':''}>${icon(s.icon)}${s.label}${s.badge?`<b>${s.badge}</b>`:''}</a>`).join('');
  let head = '';
  if (!HEADLESS.test(route)) {
    let title = TITLES[route] || (sec && sec.label) || '';
    if (route.startsWith('set-') && route !== 'set-home') head += `<div class="crumb"><a href="#set-home">Settings</a><span>/</span><span>${title}</span></div>`;
    head += `<h1>${title}</h1>`;
    if (sec && sec.pages.length) head += `<div class="tabs">${sec.pages.map(([h,l,n]) => `<a href="#${h}" class="${h===route?'on':''}">${l}${n?`<em>${n}</em>`:''}</a>`).join('')}</div>`;
  }
  document.getElementById('page').innerHTML = head + V[route]();
  window.scrollTo(0, 0);
}
let timer;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toast]');
  if (t) { const box = document.getElementById('toast'); box.textContent = t.dataset.toast; box.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => box.classList.remove('show'), 1600); return; }
  const s = e.target.closest('[data-sw]');
  if (s) { s.setAttribute('aria-pressed', s.getAttribute('aria-pressed') !== 'true'); return; }
  const r = e.target.closest('tr[data-go]');
  if (r && !e.target.closest('a')) location.hash = r.dataset.go;
});
window.addEventListener('hashchange', render);
render();
</script>
